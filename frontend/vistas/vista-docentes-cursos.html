<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docentes y cursos | CLARD Academy</title>
  <link rel="icon" href="../img/icono.jpg">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.18"></script>
  <script src="../js/tema.js"></script>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-pagina="docentes" data-raiz="../">
  <div class="min-h-screen md:grid md:grid-cols-[248px_1fr]">
    <aside class="menu" id="menu"></aside>

    <main class="contenido min-w-0 px-4 pt-8 pb-12 md:px-10">
      <header class="mb-6 flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1>Docentes y cursos</h1>
          <p class="mt-1.5 max-w-[62ch] text-tinta-suave">Registra docentes y cursos, y asigna qué docente imparte cada curso.</p>
        </div>
      </header>

      <div class="pestanas" role="tablist" aria-label="Secciones">
        <button class="pestana" role="tab" id="tab-docentes" aria-controls="panel-docentes" aria-selected="true" type="button">Docentes</button>
        <button class="pestana" role="tab" id="tab-cursos" aria-controls="panel-cursos" aria-selected="false" type="button">Cursos</button>
        <button class="pestana" role="tab" id="tab-asignaciones" aria-controls="panel-asignaciones" aria-selected="false" type="button">Asignaciones</button>
      </div>

      <section class="panel" id="panel-docentes" role="tabpanel" aria-labelledby="tab-docentes">
        <div class="panel-encabezado">
          <h2>Docentes registrados</h2>
          <div class="flex items-center gap-3">
            <span class="text-sm text-tinta-suave" id="contador-docentes"></span>
            <button class="btn btn-primario" type="button" data-abrir="modal-docente">Registrar docente</button>
          </div>
        </div>
        <div id="tabla-docentes"><div class="cargando">Cargando docentes…</div></div>
      </section>

      <section class="panel" id="panel-cursos" role="tabpanel" aria-labelledby="tab-cursos" hidden>
        <div class="panel-encabezado">
          <h2>Cursos registrados</h2>
          <div class="flex items-center gap-3">
            <span class="text-sm text-tinta-suave" id="contador-cursos"></span>
            <button class="btn btn-primario" type="button" data-abrir="modal-curso">Registrar curso</button>
          </div>
        </div>
        <div id="tabla-cursos"><div class="cargando">Cargando cursos…</div></div>
      </section>

      <section class="panel" id="panel-asignaciones" role="tabpanel" aria-labelledby="tab-asignaciones" hidden>
        <div class="panel-encabezado">
          <h2>Cursos por docente</h2>
          <div class="flex items-center gap-3">
            <span class="text-sm text-tinta-suave" id="contador-asignaciones"></span>
            <button class="btn btn-primario" type="button" data-abrir="modal-asignacion">Asignar curso</button>
          </div>
        </div>
        <div id="tabla-asignaciones"><div class="cargando">Cargando asignaciones…</div></div>
      </section>

      <!-- Ventanas emergentes -->
      <dialog class="modal" id="modal-docente" aria-labelledby="titulo-modal-docente">
        <div class="modal-encabezado">
          <h2 id="titulo-modal-docente">Registrar docente</h2>
          <button class="modal-cerrar" type="button" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
        </div>
        <form class="modal-cuerpo" id="form-docente" novalidate>
          <div class="campo">
            <label for="doc-nombre">Nombre completo</label>
            <input id="doc-nombre" name="nombre" required placeholder="Ing. Nombre Apellido" autofocus>
          </div>
          <div class="campo">
            <label for="doc-especialidad">Especialidad</label>
            <input id="doc-especialidad" name="especialidad" placeholder="Matemática, Programación…">
          </div>
          <div class="modal-botones">
            <button class="btn btn-secundario" type="button" data-cerrar>Cancelar</button>
            <button class="btn btn-primario" type="submit">Guardar docente</button>
          </div>
        </form>
      </dialog>

      <dialog class="modal" id="modal-curso" aria-labelledby="titulo-modal-curso">
        <div class="modal-encabezado">
          <h2 id="titulo-modal-curso">Registrar curso</h2>
          <button class="modal-cerrar" type="button" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
        </div>
        <form class="modal-cuerpo" id="form-curso" novalidate>
          <div class="grid gap-3 sm:grid-cols-2">
            <div class="campo">
              <label for="cur-codigo">Código</label>
              <input id="cur-codigo" name="codigo" required placeholder="MAT101" pattern="[A-Za-z]{3}\d{3}" autofocus>
            </div>
            <div class="campo">
              <label for="cur-creditos">Créditos</label>
              <input id="cur-creditos" name="creditos" type="number" min="1" max="10" value="5" required>
            </div>
          </div>
          <div class="campo">
            <label for="cur-nombre">Nombre del curso</label>
            <input id="cur-nombre" name="nombre" required placeholder="Matemática I">
          </div>
          <div class="campo">
            <label for="cur-semestre">Semestre</label>
            <input id="cur-semestre" name="semestre" type="number" min="1" max="10" value="1" required>
          </div>
          <div class="modal-botones">
            <button class="btn btn-secundario" type="button" data-cerrar>Cancelar</button>
            <button class="btn btn-primario" type="submit">Guardar curso</button>
          </div>
        </form>
      </dialog>

      <dialog class="modal" id="modal-asignacion" aria-labelledby="titulo-modal-asignacion">
        <div class="modal-encabezado">
          <h2 id="titulo-modal-asignacion">Asignar curso</h2>
          <button class="modal-cerrar" type="button" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
        </div>
        <form class="modal-cuerpo" id="form-asignacion" novalidate>
          <div class="campo">
            <label for="asig-docente">Docente</label>
            <select id="asig-docente" name="docenteId" required autofocus></select>
          </div>
          <div class="campo">
            <label for="asig-curso">Curso</label>
            <select id="asig-curso" name="cursoCodigo" required></select>
          </div>
          <div class="modal-botones">
            <button class="btn btn-secundario" type="button" data-cerrar>Cancelar</button>
            <button class="btn btn-primario" type="submit">Asignar curso</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="vista-docentes-cursos.js"></script>
</body>
</html>
